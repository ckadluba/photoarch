name: Build and Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v7
      
    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.14'

    - name: Set up uv
      uses: astral-sh/setup-uv@v6
      with:
        enable-cache: true
        
    - name: Install exiftool
      run: |
        sudo apt-get update
        sudo apt-get install -y exiftool
        
    - name: Install project and dependencies
      run: |
        uv sync --locked --dev
        
    - name: Verify module installation
      run: |
        uv run python -c "import photoarch; print('photoarch module imported successfully')"
        uv run python -m photoarch.main --help
        
    - name: Run tests with pytest
      run: |
        uv run pytest -v --log-cli-level=INFO tests/
